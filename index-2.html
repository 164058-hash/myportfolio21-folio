<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      min-height: 100vh;
      color: #172033;
      background:
        radial-gradient(circle at 15% 15%, #e8efff 0, transparent 35%),
        radial-gradient(circle at 85% 85%, #f4eaff 0, transparent 35%),
        #f7f9fc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      width: min(920px, 100%);
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(30,50,90,.08);
      border-radius: 28px;
      padding: 70px 70px 55px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(28, 40, 70, .12);
    }
    .badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4055a8;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .5px;
      margin-bottom: 22px;
    }
    h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }
    .subtitle {
      color: #68738a;
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.7;
      max-width: 650px;
      margin: 0 auto 38px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 30px;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      background: #172033;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 12px 25px rgba(23,32,51,.18);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 32px rgba(23,32,51,.25);
    }
    .info {
      margin-top: 48px;
      padding-top: 28px;
      border-top: 1px solid #e8ebf1;
      color: #8a93a5;
      font-size: 14px;
    }
    .info strong { color: #596277; }
    @media (max-width: 650px) {
      .card { padding: 48px 25px 38px; border-radius: 22px; }
      h1 { letter-spacing: -1px; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">PORTFOLIO</div>
    <h1>My Portfolio</h1>
    <p class="subtitle">
      แฟ้มสะสมผลงานสำหรับการศึกษาต่อ<br>
      คลิกปุ่มด้านล่างเพื่อเปิด Portfolio ฉบับเต็มบน Canva
    </p>

    <a class="btn"
       href="https://canva.link/64oudau7cqr00zp"
       target="_blank"
       rel="noopener noreferrer">
      เปิด Portfolio บน Canva ↗
    </a>

    <div class="info">
      <strong>Portfolio Website</strong><br>
      เปิดได้ทั้งคอมพิวเตอร์ แท็บเล็ต และโทรศัพท์
    </div>
  </main>
</body>
</html>
